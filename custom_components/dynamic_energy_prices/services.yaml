force_update:
  name: Force update
  description: Force refresh energy price data from the provider.
  target:
    entity:
      integration: dynamic_energy_prices
      domain:
        - sensor
        - binary_sensor
install_dashboard:
  name: Install dashboard
  description: Install or update the Energy Prices Lovelace dashboard for all configured entries.
uninstall_dashboard:
  name: Uninstall dashboard
  description: Remove the Energy Prices Lovelace dashboard and its panel.
